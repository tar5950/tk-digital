<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mister Grill — Commande en ligne</title>
<meta name="description" content="Mister Grill, fast casual halal au 22 rue Chaligny, Paris 12e. Smash burgers, home made burgers, sandwichs, brasserie, desserts. Commande à emporter ou sur place.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mister Grill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e3101f; --red-d:#a50b16; --blue:#1d3fb8;
  --bg:#0a0a0b; --bg2:#121215; --card:#17171b; --line:#26262c;
  --ink:#fff; --mute:#a0a0aa; --ok:#27c26c;
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;overscroll-behavior-y:none}
body{min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
.app{max-width:560px;margin:0 auto;position:relative}
.disp{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.5px;font-weight:400}

/* ===== Splash ===== */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#splash img{width:min(80vw,420px);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
#splash .bar{position:absolute;bottom:18%;width:120px;height:4px;background:#222;border-radius:4px;overflow:hidden}
#splash .bar::after{content:"";position:absolute;inset:0;background:var(--red);transform-origin:left;animation:load 1.1s ease-out forwards}
#splash.hide{opacity:0;visibility:hidden}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ===== Header ===== */
.hero{position:relative;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 18px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 0% 0%,rgba(29,63,184,.55),transparent 60%),
    radial-gradient(120% 90% at 100% 10%,rgba(227,16,31,.55),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 26px),
    #050507;}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--bg))}
.hero .logo{width:min(78%,340px);margin:6px auto 10px;filter:drop-shadow(0 6px 20px rgba(227,16,31,.35))}
.status{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(39,194,108,.25)}
.dot.off{background:#ff5a5a;box-shadow:0 0 0 3px rgba(255,90,90,.25)}

/* ===== Views ===== */
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Promos carousel */
.promos{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 8px;scrollbar-width:none}
.promos::-webkit-scrollbar{display:none}
.promo{flex:0 0 78%;scroll-snap-align:center;position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:#111;text-align:left}
.promo img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.promo .cap{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.promo .cap b{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-size:22px;text-transform:uppercase;display:block;line-height:1.05}
.promo .cap span{font-size:12px;color:#ddd}
.promo .tag{position:absolute;top:10px;left:10px}

/* sticker (DA menu) */
.sticker{display:inline-block;background:#fff;color:var(--red);font-family:Anton,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;padding:3px 9px 2px;transform:rotate(-3deg);box-shadow:3px 3px 0 rgba(0,0,0,.35);font-size:14px;line-height:1.1}
.sticker.red{background:var(--red);color:#fff}

/* search */
.search{margin:10px 16px 4px;position:relative}
.search input{width:100%;padding:13px 14px 13px 42px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:#fff;font:500 15px Poppins,system-ui,sans-serif;outline:none}
.search input:focus{border-color:var(--red)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}

/* category bar */
.cats{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cats-in{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.cats-in::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;color:#ddd;transition:.2s}
.cat.on{background:var(--red);border-color:var(--red);color:#fff}

/* sections */
.sec{padding:22px 16px 4px;scroll-margin-top:62px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{margin:0;font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:30px;line-height:1;text-transform:uppercase;background:#fff;color:var(--red);padding:6px 12px 4px;border-radius:0 14px 14px 0;margin-left:-16px;padding-left:16px;box-shadow:4px 4px 0 var(--red-d)}
.sec-h p{margin:0;font-size:11.5px;color:var(--mute);text-align:right;max-width:52%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;text-align:left;position:relative;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .ph{aspect-ratio:1/1;background:#b0101b;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1}
.card h3{margin:0 0 4px;font-size:14px;font-weight:700;line-height:1.2}
.card .ds{font-size:11px;color:var(--mute);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.card .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.price{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-size:19px;color:#fff}
.plus{width:32px;height:32px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-size:22px;font-weight:700;line-height:1;box-shadow:0 4px 12px rgba(227,16,31,.45)}
.card .badge{position:absolute;top:8px;left:8px}
.card .qtyb{position:absolute;top:8px;right:8px;background:var(--ok);color:#fff;font-weight:800;font-size:12px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px}
.card.wide{grid-column:1/-1;flex-direction:row}
.card.wide .ph{aspect-ratio:auto;width:44%;min-height:170px}
.card.off{opacity:.55}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}

/* ===== Bottom nav ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,10,11,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute);position:relative}
.nav button.on{color:#fff}
.nav button.on svg{stroke:var(--red)}
.nav .cnt[hidden]{display:none}
.nav .cnt{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:800;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

/* floating cart bar */
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(72px + var(--safe-b));z-index:39;max-width:536px;margin:0 auto;background:var(--red);border-radius:16px;padding:13px 16px;display:none;align-items:center;justify-content:space-between;font-weight:700;box-shadow:0 10px 30px rgba(227,16,31,.45)}
.cartbar.on{display:flex;animation:up .3s ease}
.cartbar .n{background:rgba(0,0,0,.25);border-radius:8px;padding:2px 8px;margin-right:8px}
body.bar{padding-bottom:calc(150px + var(--safe-b))}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* ===== Sheets ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;visibility:hidden;transition:.25s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--bg2);border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility 0s .32s}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sheet .scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet .close{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:20px}
.p-img{aspect-ratio:4/3;background:#b0101b;border-radius:24px 24px 0 0;overflow:hidden}
.p-img img{width:100%;height:100%;object-fit:cover}
.p-bd{padding:16px}
.p-bd h2{margin:0;font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:28px;text-transform:uppercase;line-height:1.05}
.p-bd .desc{color:#cfcfd6;font-size:14px;line-height:1.5;margin:8px 0 4px}
.p-bd .serv{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:#fff;background:rgba(227,16,31,.15);border:1px solid rgba(227,16,31,.4);padding:5px 10px;border-radius:99px;margin-top:6px}
.opt{margin-top:18px}
.opt h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.opt h4 small{font-size:11px;font-weight:600;color:var(--mute);background:var(--card);padding:3px 8px;border-radius:99px}
.opt h4 small.req{color:#fff;background:var(--red)}
.opt h4 small.done{background:var(--ok);color:#fff}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.ch{padding:9px 13px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:500}
.ch.on{border-color:var(--red);background:rgba(227,16,31,.16);color:#fff}
.ch em{font-style:normal;color:var(--mute);margin-left:4px;font-size:12px}
textarea,input.f,select.f{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:#fff;font:500 14px Poppins,system-ui,sans-serif;padding:11px 12px;outline:none;resize:none}
textarea:focus,input.f:focus,select.f:focus{border-color:var(--red)}
.p-ft{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;background:var(--bg2)}
.stepper{display:flex;align-items:center;background:var(--card);border-radius:14px;border:1px solid var(--line)}
.stepper button{width:42px;height:46px;font-size:22px;font-weight:700}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.cta{flex:1;background:var(--red);border-radius:14px;height:48px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(227,16,31,.35)}
.cta:disabled{background:#3a3a40;box-shadow:none;color:#888}
.cta.wa{background:#1faa53;box-shadow:0 6px 20px rgba(31,170,83,.35)}
.warn{margin-top:12px;font-size:12.5px;background:rgba(255,196,0,.1);border:1px solid rgba(255,196,0,.35);color:#ffd766;padding:9px 12px;border-radius:12px}

/* cart view */
.pad{padding:16px}
.h1{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;text-transform:uppercase;font-size:34px;margin:6px 0 14px;line-height:1}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:#b0101b}
.line .i{flex:1;min-width:0}
.line b{font-size:14px;display:block}
.line small{display:block;font-size:11.5px;color:var(--mute);line-height:1.4}
.line .r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.mini{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:10px;border:1px solid var(--line)}
.mini button{width:30px;height:30px;font-weight:800;font-size:16px}
.tot{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px;font-weight:700}
.tot .price{font-size:28px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.box h3{margin:0 0 10px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);font-weight:600;font-size:14px}
.seg button.on{border-color:var(--red);background:rgba(227,16,31,.16)}
.field{margin-top:10px}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:500}

/* infos view */
.info-hero{border-radius:var(--r);overflow:hidden;position:relative}
.info-hero img{width:100%}
.hours{width:100%;border-collapse:collapse;font-size:14px}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-weight:600}
.hours tr.today td{color:var(--red);font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;text-decoration:none;color:#fff}
.halal{display:flex;align-items:center;gap:12px}
.halal .hb{width:52px;height:52px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:800;font-size:11px;flex:0 0 auto}

/* toast */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-80px);z-index:90;background:#fff;color:#111;font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .3s;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.install{margin:14px 16px 0;display:none;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(29,63,184,.35),rgba(227,16,31,.35));border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:12px 14px}
.install.on{display:flex}
.install p{margin:0;font-size:12.5px;flex:1}
.install button{background:#fff;color:#111;font-weight:700;border-radius:10px;padding:8px 12px;font-size:13px}
/* best-sellers */
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hs::-webkit-scrollbar{display:none}
.mini-card{flex:0 0 138px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;position:relative}
.mini-card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.mini-card .t{padding:8px 10px 10px;font-size:12.5px;font-weight:700;line-height:1.2}
.mini-card .t span{display:block;font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:16px;margin-top:3px}
.mini-card .rk{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font:800 11px Poppins,system-ui,sans-serif;border-radius:8px;padding:2px 7px}
.sec-top{padding:18px 0 2px}.sec-top .sec-h{padding:0 16px}
/* recommander + fidélité */
.reorder{margin:12px 16px 0;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.gift{margin:12px 16px 0;display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 14px;background:linear-gradient(90deg,rgba(29,63,184,.4),rgba(227,16,31,.4));border:1px solid rgba(255,255,255,.14)}
.gift .ic{font-size:30px}.gift p{margin:0;flex:1;font-size:12.5px;color:#e6e6ee;min-width:0}.gift p b{color:#fff;display:block;font-size:14px}
.gift button{background:#fff;color:#111;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.gift-howto{margin:8px 16px 0;font-size:12.5px;color:#cfcfd6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.reco{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:16px 16px calc(14px + var(--safe-b));transform:translateY(110%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s .3s;border-top:1px solid var(--line)}
.reco.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.reco h3{margin:0 0 2px;font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:22px;text-transform:uppercase}
.reco .why{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.why-tag{display:block;font-size:10.5px;font-weight:600;color:#ffd23b;margin-top:3px}
.welcome{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.72);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.welcome.on{opacity:1;visibility:visible;transition:opacity .3s}
.welcome .card-w{width:min(100%,400px);background:var(--bg2);border-radius:24px;overflow:hidden;border:1px solid var(--line);transform:scale(.9);transition:transform .35s cubic-bezier(.2,1.3,.4,1);position:relative}
.welcome.on .card-w{transform:none}
.welcome .card-w img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 30%}
.welcome .wb{padding:16px}
.welcome h2{margin:0;font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:28px;text-transform:uppercase;line-height:1.05}
.welcome p{margin:6px 0 14px;color:#cfcfd6;font-size:14px}
.grp{margin:0 16px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.grp::-webkit-scrollbar{display:none}
.grp .lbl{font-size:12px;color:var(--mute);white-space:nowrap}
.who{flex:0 0 auto;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg2);font-size:13px;font-weight:600}
.who.on{border-color:#ffd23b;background:rgba(255,210,59,.15);color:#fff}
.who.add{border-style:dashed;color:var(--mute)}
.pers{margin-top:14px;font-size:13px;font-weight:700;color:#ffd23b;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}
.reorder .ic{font-size:26px}.reorder p{margin:0;flex:1;font-size:12.5px;color:var(--mute);min-width:0}.reorder p b{color:#fff;display:block;font-size:14px}
.reorder button{background:var(--red);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.stamp{aspect-ratio:1/1;border-radius:50%;border:2px dashed #3a3a42;display:grid;place-items:center;font-size:18px}
.stamp.on{border:2px solid var(--red);background:rgba(227,16,31,.18)}
.stamp.gift{border-style:solid;border-color:#ffd23b}
/* upsell */
.ups{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.ups::-webkit-scrollbar{display:none}
.up{flex:0 0 118px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left}
.up img{width:100%;aspect-ratio:4/3;object-fit:cover}
.up div{padding:7px 9px 9px;font-size:12px;font-weight:600;line-height:1.2}
.up div span{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-weight:800}
.up div span i{font-style:normal;background:var(--red);border-radius:8px;width:24px;height:24px;display:grid;place-items:center}
/* suivi */
.onum{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-size:44px;letter-spacing:1px;line-height:1;margin:4px 0}
.steps{display:grid;gap:0;margin-top:6px}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.step:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.step .b{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--bg2);border:2px solid var(--line);position:relative;z-index:1}
.step.done .b{background:var(--ok);border-color:var(--ok)}
.step.cur .b{border-color:var(--red);box-shadow:0 0 0 4px rgba(227,16,31,.2)}
.step p{margin:3px 0 0;font-size:13px;color:var(--mute);min-width:0}.step p b{color:#fff;display:block;font-size:14px}
footer{padding:26px 16px 10px;text-align:center;color:#55555e;font-size:11px}
</style>
</head>
<body>
<div id="splash"><img src="img/logo.png" alt="Mister Grill"><div class="bar"></div></div>

<div class="app">
  <!-- ===== MENU ===== -->
  <main id="v-menu" class="view on">
    <header class="hero">
      <img class="logo" src="img/logo.png" alt="Mister Grill — Fast Casual">
      <div class="status">
        <span class="chip" id="openChip"><i class="dot"></i><span>…</span></span>
        <span class="chip">☪ Halal</span>
        <span class="chip">📍 Paris 12e</span>
      </div>
    </header>

    <div class="promos" id="promos"></div>
    <div id="giftBar"></div>
    <div id="reorder"></div>

    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Burger, tiramisu, escalope…" autocomplete="off">
    </div>

    <nav class="cats"><div class="cats-in" id="cats"></div><div id="grpBar"></div></nav>
    <div id="sections"></div>
    <footer>Mister Grill · 22 rue Chaligny 75012 Paris<br>Photos non contractuelles · Prix TTC</footer>
  </main>

  <!-- ===== PANIER ===== -->
  <section id="v-cart" class="view"><div class="pad" id="cartBody"></div></section>

  <!-- ===== INFOS ===== -->
  <section id="v-info" class="view"><div class="pad" id="infoBody"></div></section>

  <!-- ===== CONFIRMATION ===== -->
  <section id="v-done" class="view"><div class="pad" id="doneBody"></div></section>
</div>

<button class="cartbar" id="cartbar"><span><span class="n" id="cbN">0</span>Voir le panier</span><span id="cbT">0,00 €</span></button>

<nav class="nav"><div class="nav-in">
  <button data-v="menu" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 0-16 0Z"/><path d="M3 15h18"/><path d="M5 19h14a1 1 0 0 0 1-1v0H4v0a1 1 0 0 0 1 1Z"/></svg>Menu</button>
  <button data-v="promos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Offres</button>
  <button data-v="cart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Panier<span class="cnt" id="navCnt" hidden>0</span></button>
  <button data-v="info"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Infos</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="reco" id="reco"></div>
<div class="welcome" id="welcome"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="menu.js"></script>
<script>
(() => {
const C = window.MG_CONFIG, MENU = window.MG_MENU, PROMOS = window.MG_PROMOS, BEST = window.MG_BEST || [], UPSELL = window.MG_UPSELL || [];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const eur = n => n.toFixed(2).replace('.', ',') + ' €';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ITEMS = {}; MENU.forEach(s => s.items.forEach(i => { i.cat = s.id; ITEMS[i.id] = i; }));
const DAYS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const hm = m => (m >= 1440 ? '00' : String(Math.floor(m / 60)).padStart(2, '0')) + 'h' + String(m % 60).padStart(2, '0');

/* ---------- storage (safe) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('mg:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mg:' + k, JSON.stringify(v)); } catch {} }
};
let cart = store.get('cart', []).filter(l => ITEMS[l.id]);
let last = store.get('last', null);   // dernière commande envoyée
let stamps = store.get('stamps', 0);  // tampons fidélité
const GIFT = C.installGift && ITEMS[C.installGift.item] ? C.installGift : null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let gift = store.get('gift', 'locked');   // locked | unlocked | used
if (GIFT && gift === 'locked' && standalone()) { gift = 'unlocked'; store.set('gift', gift); }
const giftActive = () => GIFT && gift === 'unlocked';
let howto = false;
let group = store.get('group', null);   // { names:[...], cur:0 } commande de groupe
const whoName = l => group && l.who != null ? group.names[l.who] : null;
let order = null;                     // commande en cours de confirmation
if (last) last.lines = last.lines.filter(l => ITEMS[l.id]);
let form = store.get('form', { mode: C.modes[0], name: '', phone: '', time: 'asap', note: '' });

/* ---------- horaires ---------- */
function nowMin(d = new Date()) { return d.getHours() * 60 + d.getMinutes(); }
function isOpen(d = new Date()) { const [o, c] = C.hours[d.getDay()]; const m = nowMin(d); return m >= o && m < c; }
function nextOpen(d = new Date()) {
  for (let k = 0; k < 8; k++) {
    const day = (d.getDay() + k) % 7, [o] = C.hours[day];
    if (k > 0 || nowMin(d) < o) return { day, k, o };
  }
}
function openLabel() {
  if (isOpen()) return { on: true, t: 'Ouvert · jusqu\'à ' + hm(C.hours[new Date().getDay()][1]) };
  const n = nextOpen(); return { on: false, t: 'Fermé · ouvre ' + (n.k === 0 ? 'à ' : n.k === 1 ? 'demain ' : DAYS[n.day].toLowerCase() + ' ') + hm(n.o) };
}
function inWindow(it, d = new Date()) {
  if (!it.window) return true;
  const m = nowMin(d); return it.window.days.includes(d.getDay()) && m >= it.window.from && m < it.window.to;
}
function slots() {
  const out = [], d = new Date();
  if (isOpen(d)) {
    out.push({ v: 'asap', t: 'Dès que possible (~20 min)' });
    const close = C.hours[d.getDay()][1];
    for (let m = Math.ceil((nowMin(d) + 30) / 15) * 15; m <= close - 15; m += 15) out.push({ v: hm(m), t: 'Aujourd\'hui à ' + hm(m) });
  } else {
    const n = nextOpen(d), lbl = n.k === 0 ? 'Aujourd\'hui' : n.k === 1 ? 'Demain' : DAYS[n.day];
    for (let m = n.o + 15; m <= Math.min(n.o + 240, C.hours[n.day][1] - 15); m += 15) out.push({ v: lbl + ' ' + hm(m), t: lbl + ' à ' + hm(m) });
  }
  return out;
}

/* ---------- rendu menu ---------- */
function renderStatus() {
  const s = openLabel(); $('#openChip').innerHTML = `<i class="dot ${s.on ? '' : 'off'}"></i><span>${s.t}</span>`;
}
function renderPromos() {
  $('#promos').innerHTML = PROMOS.map(p => `
    <button class="promo" data-go="${p.target}"><img src="${p.img}" alt="" loading="lazy">
      <span class="tag sticker red">Offre</span>
      <span class="cap"><b>${esc(p.title)}</b><span>${esc(p.text)}</span></span></button>`).join('');
}
function qtyOf(id) { return cart.filter(l => l.id === id).reduce((a, l) => a + l.qty, 0); }
function cardHTML(it, wide) {
  const q = qtyOf(it.id), off = !inWindow(it);
  return `<button class="card${wide ? ' wide' : ''}${off ? ' off' : ''}" data-item="${it.id}">
    <div class="ph"><img src="${it.img}" alt="${esc(it.name)}" loading="lazy"></div>
    ${it.badge ? `<span class="badge sticker">${esc(it.badge)}</span>` : ''}
    ${q ? `<span class="qtyb">${q}</span>` : ''}
    <div class="bd"><h3>${esc(it.name)}</h3><div class="ds">${esc(it.desc)}</div>
    <div class="ft"><span class="price">${eur(it.price)}</span><span class="plus">+</span></div></div></button>`;
}
function renderMenu(filter = '') {
  const f = filter.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let html = '';
  MENU.forEach(s => {
    const items = f ? s.items.filter(i => norm(i.name + ' ' + i.desc + ' ' + s.title).includes(f)) : s.items;
    if (!items.length) return;
    const wide = items.length === 1;
    html += `<section class="sec" id="s-${s.id}"><div class="sec-h"><h2>${esc(s.title)}</h2><p>${esc(s.sub || '')}</p></div>
      <div class="grid">${items.map(i => cardHTML(i, wide)).join('')}</div></section>`;
  });
  if (!f && BEST.length) html = `<section class="sec-top"><div class="sec-h"><h2>Top ventes</h2><p>Les + commandés cette semaine</p></div>
    <div class="hs">${BEST.filter(id => ITEMS[id]).map((id, k) => { const it = ITEMS[id]; return `<button class="mini-card" data-item="${id}"><span class="rk">#${k + 1}</span><img src="${it.img}" alt="" loading="lazy"><div class="t">${esc(it.name)}<span>${eur(it.price)}</span></div></button>`; }).join('')}</div></section>` + html;
  renderReorder(); renderGift(); renderGroupBar();
  $('#sections').innerHTML = html || `<div class="empty">Aucun plat ne correspond à « ${esc(filter)} »</div>`;
  $('#cats').innerHTML = MENU.filter(s => !f || $('#s-' + s.id)).map(s => `<button class="cat" data-cat="${s.id}">${esc(s.title)}</button>`).join('');
  spy();
}
function spy() {
  const secs = $$('.sec'); if (!secs.length) return;
  let cur = secs[0].id;
  secs.forEach(s => { if (s.getBoundingClientRect().top < 90) cur = s.id; });
  $$('.cat').forEach(b => {
    const on = 's-' + b.dataset.cat === cur;
    if (on && !b.classList.contains('on')) b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    b.classList.toggle('on', on);
  });
}
function goCat(id) {
  show('menu');
  const el = $('#s-' + id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 58, behavior: 'smooth' });
}

function renderGift() {
  const el = $('#giftBar'); if (!el || !GIFT) return;
  const it = ITEMS[GIFT.item];
  if (gift === 'unlocked') {
    el.innerHTML = `<div class="gift"><span class="ic">🎁</span><p><b>${esc(GIFT.label)} débloqué !</b>Merci d'avoir installé l'app. Il est ajouté automatiquement à ta prochaine commande.</p></div>`;
  } else if (gift === 'locked' && !standalone()) {
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    el.innerHTML = `<div class="gift"><span class="ic">🎁</span><p><b>Installe l'app : ${esc(GIFT.label.toLowerCase())} !</b>Ajoute Mister Grill à ton écran d'accueil, ${esc(it.name.toLowerCase())} offert sur ta prochaine commande.</p><button id="giftInstall">${deferred ? 'Installer' : 'Comment ?'}</button></div>
      ${howto ? `<div class="gift-howto">${isIOS ? 'Dans <b>Safari</b> : touche <b>Partager</b> ⬆️ puis <b>Sur l\'écran d\'accueil</b>. Ouvre ensuite Mister Grill depuis l\'icône : ton cadeau apparaît.' : 'Dans le menu du navigateur ⋮ : <b>Installer l\'application</b> ou <b>Ajouter à l\'écran d\'accueil</b>. Ouvre ensuite Mister Grill depuis l\'icône : ton cadeau apparaît.'}</div>` : ''}`;
  } else el.innerHTML = '';
}
/* ---------- suggestions intelligentes ---------- */
const MAINS = ['smash', 'homemade', 'classique', 'sandwich', 'brasserie', 'pasta', 'gratins', 'salades', 'offres', 'enfant'];
function suggest(max = 3, forItem = null) {
  const inCart = new Set(cart.map(l => l.id)), cats = cart.map(l => ITEMS[l.id].cat);
  const mains = cart.filter(l => MAINS.includes(ITEMS[l.id].cat)).reduce((a, l) => a + l.qty, 0);
  const has = c => cats.includes(c), h = new Date().getHours();
  const base = forItem ? forItem.name : (cart[0] ? ITEMS[cart[0].id].name : '');
  const out = [], push = (id, why) => { if (ITEMS[id] && !inCart.has(id) && !out.some(o => o.id === id) && !(giftActive() && id === GIFT.item) && !(ITEMS[id].opts || []).some(o => o.required)) out.push({ id, why }); };
  // 1. plat sans frites incluses (brasserie, pasta, salades, gratins) -> frites
  if (cats.some(c => ['brasserie', 'pasta', 'salades', 'gratins'].includes(c)) && !has('frenchies')) push('frites-maison', 'Parfait avec ton plat');
  // 2. burger / sandwich -> un extra à grignoter
  if (cats.some(c => ['smash', 'homemade', 'classique', 'sandwich'].includes(c)) && !has('extras')) {
    push(forItem && /chicken|crunchy|tender|crousty|poulet/i.test(forItem.name) ? 'x-mozza' : 'x-tenders', base ? 'Souvent pris avec ' + base : 'Le + commandé en extra');
    push('x-camembert', 'Le coup de cœur des habitués');
  }
  // 3. à plusieurs -> à partager
  if (mains >= 2) { push('x-nuggets', 'À partager (' + mains + ' plats)'); push('d-tiramisu-barq', 'Le dessert à partager'); }
  // 4. dessert selon l'heure
  if (!has('desserts')) {
    if (h >= 14 && h < 19) { push('d-milkshake', 'Idéal l\'après-midi'); push('d-smoothie', 'Frais et fruité'); }
    else if (h >= 19) { push('d-pain-perdu', 'Pour finir en douceur'); push('d-waffle-cone', 'Notre dessert star'); }
    else { push('d-cookie', 'Le petit plus à 2,90 €'); push('d-waffle-cup', 'Notre dessert star'); }
  }
  UPSELL.forEach(id => push(id, 'Populaire en ce moment'));
  return out.slice(0, max);
}
function upCard(s) { const it = ITEMS[s.id]; return `<button class="up" data-quick="${s.id}"><img src="${it.img}" alt="" loading="lazy"><div>${esc(it.name)}<span class="why-tag" style="margin:0">${esc(s.why)}</span><span>${eur(it.price)}<i>+</i></span></div></button>`; }
function openReco(it) {
  const list = suggest(3, it); if (!list.length) return;
  $('#reco').innerHTML = `<h3>Ça irait bien avec…</h3><p class="why">Complète ta commande en un appui</p>
    <div class="ups">${list.map(upCard).join('')}</div>
    <button class="btn" data-close-reco="1" style="width:100%;margin-top:12px">Non merci</button>`;
  $('#reco').classList.add('on'); $('#scrim').classList.add('on');
}
function closeReco() { $('#reco').classList.remove('on'); if (!$('#sheet').classList.contains('on')) $('#scrim').classList.remove('on'); }

/* ---------- commande de groupe ---------- */
function renderGroupBar() {
  const el = $('#grpBar'); if (!el) return;
  if (!group) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="grp"><span class="lbl">👥 Ajout pour :</span>${group.names.map((n, i) => `<button class="who ${i === group.cur ? 'on' : ''}" data-who="${i}">${esc(n)}</button>`).join('')}<button class="who add" data-grp-add="1">+ Ajouter</button><button class="who add" data-grp-end="1">Terminer</button></div>`;
}
function openGroup() {
  $('#sheet').innerHTML = `<button class="close" data-close>✕</button><div class="scroll"><div class="p-bd" style="padding-top:22px">
    <h2>Commande de groupe</h2>
    <p class="desc">Tout le monde commande sur un seul panier, chacun voit ce qu'il a pris, et le resto reçoit <b>un seul ticket</b> trié par personne.</p>
    <div class="field"><label>Ton prénom (organisateur)</label><input class="f" id="gHost" value="${esc(form.name || '')}" placeholder="Ex : Yanis"></div>
    <div class="field"><label>Les autres (séparés par une virgule)</label><input class="f" id="gOthers" placeholder="Ex : Sam, Inès, Karim"></div>
    <div class="warn" style="background:rgba(255,255,255,.05);border-color:var(--line);color:#cfcfd6">Astuce : passe le téléphone à chacun, ou demande-lui son choix, puis sélectionne son prénom en haut de la carte avant d'ajouter.</div>
  </div></div>
  <div class="p-ft"><button class="cta" id="gStart">Lancer la commande de groupe</button></div>`;
  openSheet();
}
function startGroup() {
  const host = $('#gHost').value.trim() || 'Moi';
  const names = [host, ...$('#gOthers').value.split(',').map(x => x.trim()).filter(Boolean)].slice(0, 12);
  group = { names, cur: 0 }; store.set('group', group);
  cart.forEach(l => { if (l.who == null) l.who = 0; }); store.set('cart', cart);
  closeSheet(); show('menu'); toast('👥 Groupe lancé · ' + names.length + ' personne(s)');
}

function renderReorder() {
  const el = $('#reorder'); if (!el) return;
  if (!last || !last.lines.length || cart.length) { el.innerHTML = ''; return; }
  const n = last.lines.reduce((a, l) => a + l.qty, 0);
  const names = last.lines.map(l => ITEMS[l.id].name).slice(0, 2).join(', ') + (last.lines.length > 2 ? '…' : '');
  el.innerHTML = `<div class="reorder"><span class="ic">↻</span><p><b>Comme la dernière fois ?</b>${n} article(s) · ${esc(names)}</p><button data-reorder="1">Recommander</button></div>`;
}
function stampsHTML(n) {
  const g = C.loyalty.goal, cur = n % g;
  return `<div class="stamps">${Array.from({ length: g }, (_, i) => `<span class="stamp ${i < cur ? 'on' : ''} ${i === g - 1 ? 'gift' : ''}">${i < cur ? '🔥' : i === g - 1 ? '🎁' : ''}</span>`).join('')}</div>`;
}

/* ---------- fiche produit ---------- */
let cur = null;
function openItem(id, editIdx = null) {
  const it = ITEMS[id]; const line = editIdx != null ? cart[editIdx] : null;
  cur = { it, qty: line ? line.qty : 1, sel: line ? JSON.parse(JSON.stringify(line.sel)) : {}, note: line ? line.note : '', editIdx };
  (it.opts || []).forEach(o => { if (!cur.sel[o.id]) cur.sel[o.id] = []; });
  const served = ['smash', 'homemade', 'classique', 'sandwich'].includes(it.cat);
  $('#sheet').innerHTML = `
    <button class="close" data-close>✕</button>
    <div class="scroll">
      <div class="p-img"><img src="${it.img}" alt="${esc(it.name)}"></div>
      <div class="p-bd">
        <h2>${esc(it.name)}</h2>
        <p class="desc">${esc(it.desc)}</p>
        ${served ? '<span class="serv">🍟 + 🥤 Servi avec frites et boisson</span>' : ''}
        ${!inWindow(it) ? '<div class="warn">⏰ Offre disponible du lundi au vendredi de 11h à 15h (hors vacances et jours fériés). Tu peux la programmer pour un créneau valide.</div>' : ''}
        ${(it.opts || []).map(o => `
          <div class="opt" data-opt="${o.id}"><h4>${esc(o.label)} <small class="${o.required ? 'req' : ''}">${o.required ? 'Obligatoire' : 'Optionnel'}</small></h4>
          <div class="choices">${o.choices.map((c, k) => `<button class="ch" data-o="${o.id}" data-k="${k}">${esc(c.n)}${c.p ? `<em>+${eur(c.p)}</em>` : ''}</button>`).join('')}</div></div>`).join('')}
        <div class="opt"><h4>Une précision ? <small>Optionnel</small></h4>
          <textarea id="pNote" rows="2" maxlength="140" placeholder="Sans oignons, bien cuit, sauce à part…">${esc(cur.note)}</textarea></div>
      </div>
    </div>
    <div class="p-ft">
      <div class="stepper"><button data-step="-1">−</button><span id="pQty">1</span><button data-step="1">+</button></div>
      <button class="cta" id="pAdd"></button>
    </div>`;
  syncItem(); openSheet();
}
function unitPrice(it, sel) {
  let p = it.price;
  (it.opts || []).forEach(o => (sel[o.id] || []).forEach(k => p += o.choices[k].p));
  return p;
}
function syncItem() {
  const { it, sel, qty } = cur;
  $$('#sheet .ch').forEach(b => b.classList.toggle('on', (sel[b.dataset.o] || []).includes(+b.dataset.k)));
  let ok = true;
  (it.opts || []).forEach(o => {
    const done = sel[o.id].length > 0, tag = $(`#sheet [data-opt="${o.id}"] small`);
    if (o.required) { tag.className = done ? 'done' : 'req'; tag.textContent = done ? '✓' : 'Obligatoire'; if (!done) ok = false; }
  });
  $('#pQty').textContent = qty;
  const b = $('#pAdd'); b.disabled = !ok;

document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  const d = t.dataset;
  if (d.item) openItem(d.item);
  else if (d.cat) goCat(d.cat);
  else if (d.go) goCat(d.go);
  else if (d.v) show(d.v);
  else if (d.close !== undefined) closeSheet();
  else if (d.o) pick(d.o, +d.k);
  else if (d.step) { cur.qty = Math.max(1, Math.min(20, cur.qty + +d.step)); syncItem(); }
  else if (d.edit) { e.preventDefault(); openItem(cart[+d.edit].id, +d.edit); }
  else if (d.inc) { cart[+d.inc].qty++; saveCart(); }
  else if (d.dec) { const l = cart[+d.dec]; l.qty > 1 ? l.qty-- : cart.splice(+d.dec, 1); saveCart(); }
  else if (d.mode) { form.mode = d.mode; store.set('form', form); $$('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === form.mode)); }
  else if (d.welcomeClose) closeWelcome();
  else if (d.welcomeAct) { const a = d.welcomeAct; closeWelcome();
    if (a === 'reorder') { cart = JSON.parse(JSON.stringify(last.lines)); saveCart(); show('cart'); }
    else if (a === 'install') { if (deferred) installApp(); else { howto = true; renderGift(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
    else if (a.startsWith('go:')) goCat(a.slice(3));
    else if (a.startsWith('item:')) openItem(a.slice(5)); }
  else if (d.closeReco) closeReco();
  else if (d.grpOpen) openGroup();
  else if (d.who) { group.cur = +d.who; store.set('group', group); renderGroupBar(); toast('Ajout pour ' + group.names[group.cur]); }
  else if (d.grpAdd) { renderGroupBar(); $('#grpBar .grp').insertAdjacentHTML('beforeend', '<input class="f" id="gNew" placeholder="Prénom + Entrée" style="width:150px;padding:7px 10px;flex:0 0 auto">'); $('#gNew').focus(); }
  else if (d.grpEnd) { group = null; store.set('group', null); cart.forEach(l => delete l.who); saveCart(); renderGroupBar(); toast('Commande de groupe terminée'); }
  else if (t.id === 'gStart') startGroup();
  else if (d.quick) { const it = ITEMS[d.quick], sel = {}; (it.opts || []).forEach(o => sel[o.id] = []); const who = group ? group.cur : undefined; const ex = cart.find(l => l.id === it.id && l.who === who && !l.note); ex ? ex.qty++ : cart.push({ id: it.id, sel, qty: 1, note: '', who, key: it.id + JSON.stringify(sel) + (who ?? '') }); saveCart(); toast(`✓ ${it.name} ajouté`); if ($('#reco').classList.contains('on')) { const next = suggest(3); next.length ? openReco(null) : closeReco(); } }

  else if (t.id === 'cartbar') show('cart');
  else if (t.id === 'send') send();

  if (!deferred) { howto = !howto; renderGift(); return; }
  deferred.prompt(); const r = await deferred.userChoice; deferred = null;
  if (r && r.outcome === 'accepted' && GIFT && gift === 'locked') { gift = 'unlocked'; store.set('gift', gift); toast('🎁 ' + GIFT.label + ' débloqué !'); }
  const b = $('#installBox'); if (b) b.remove(); renderGift();
}
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ---------- init ---------- */
renderStatus(); renderPromos(); renderMenu(); refreshCounters();
setInterval(renderStatus, 60000);
setTimeout(() => $('#splash').classList.add('hide'), 1200);

/* ---------- écran d'accueil (1 s après l'ouverture) ---------- */
function welcomeOffer() {
  const et = ITEMS['menu-etudiant'];
  if (last && last.lines.length) {
    const n = last.lines.reduce((a, l) => a + l.qty, 0);
    return { img: ITEMS[last.lines[0].id].img, t: 'Content de te revoir !', p: `On te remet ta dernière commande (${n} article${n > 1 ? 's' : ''}) ? Un appui et c'est dans le panier.`, cta: 'Recommander', act: 'reorder' };
  }
  if (et && inWindow(et)) return { img: 'img/promo-etudiant.jpg', t: 'Menu Étudiant 8,90 €', p: 'Burger, sandwich ou wrap + frites + canette. Jusqu\'à 15h aujourd\'hui.', cta: 'J\'en profite', act: 'go:offres' };
  if (GIFT && gift === 'locked' && !standalone()) return { img: ITEMS[GIFT.item].img, t: 'Un cadeau pour toi 🎁', p: `Installe l'app Mister Grill sur ton écran d'accueil : ${ITEMS[GIFT.item].name.toLowerCase()} offert sur ta prochaine commande.`, cta: deferred ? 'Installer l\'app' : 'Comment faire ?', act: 'install' };
  const h = new Date().getHours();
  if (h >= 14 && h < 19) return { img: 'img/promo-milkshakes.jpg', t: 'Pause gourmande', p: 'Milkshakes et smoothies à partir de 4,50 €.', cta: 'Voir les boissons', act: 'go:desserts' };
  return { img: 'img/smash-pepper.jpg', t: 'Le Smash Pepper', p: '4 steaks smashés, 4 cheddars, sauce pepper. Le plus gros de la carte, servi avec frites et boisson.', cta: 'Je le veux', act: 'item:smash-pepper' };
}
function showWelcome() {
  let seen = false; try { seen = sessionStorage.getItem('mg:welcome') === '1'; sessionStorage.setItem('mg:welcome', '1'); } catch {}
  if (seen) return;
  const w = welcomeOffer();
  $('#welcome').innerHTML = `<div class="card-w"><button class="close" data-welcome-close="1" aria-label="Fermer">✕</button><img src="${w.img}" alt="">
    <div class="wb"><h2>${esc(w.t)}</h2><p>${esc(w.p)}</p><button class="cta" style="width:100%" data-welcome-act="${w.act}">${esc(w.cta)}</button>
    <button class="btn" data-welcome-close="1" style="width:100%;margin-top:8px;background:none;border:0;color:var(--mute)">Voir la carte</button></div></div>`;
  $('#welcome').classList.add('on');
}
function closeWelcome() { $('#welcome').classList.remove('on'); }
setTimeout(showWelcome, 2200);
})();
</script>
